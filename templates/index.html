<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Files - File Transfer</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
            color: #2c3e50;
        }
        .upload-section {
            border: 2px dashed #cbd5e0;
            padding: 30px;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 30px;
            transition: border-color 0.3s;
        }
        .upload-section:hover {
            border-color: #3182ce;
        }
        input[type="file"] {
            display: none;
        }
        .custom-file-upload {
            display: inline-block;
            padding: 10px 20px;
            cursor: pointer;
            background-color: #3182ce;
            color: white;
            border-radius: 5px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .custom-file-upload:hover {
            background-color: #2b6cb0;
        }
        .file-list {
            list-style: none;
            padding: 0;
        }
        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #edf2f7;
        }
        .file-item:last-child {
            border-bottom: none;
        }
        .file-name {
            font-size: 16px;
            color: #4a5568;
            text-decoration: none;
            flex-grow: 1;
        }
        .file-name:hover {
            text-decoration: underline;
        }
        .delete-btn {
            color: #e53e3e;
            text-decoration: none;
            font-size: 14px;
            margin-left: 15px;
            font-weight: bold;
        }
        .delete-btn:hover {
            color: #c53030;
        }
        .submit-btn {
            margin-top: 15px;
            width: 100%;
            padding: 12px;
            background-color: #48bb78;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .submit-btn:hover {
            background-color: #38a169;
        }
        #selected-files-count {
            margin-top: 10px;
            font-size: 14px;
            color: #718096;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>File Transfer</h1>
        
        <form action="/upload" method="post" enctype="multipart/form-data">
            <div class="upload-section">
                <label for="file-upload" class="custom-file-upload">
                    Select Files
                </label>
                <input id="file-upload" type="file" name="files" multiple onchange="updateCount()">
                <div id="selected-files-count">No files selected</div>
                <button type="submit" class="submit-btn">Upload Files</button>
            </div>
        </form>

        <div class="file-list-container">
            <h2>Shared Files</h2>
            <ul class="file-list">
                {{range .}}
                <li class="file-item">
                    <a href="/download/{{.}}" class="file-name" download>{{.}}</a>
                    <a href="/delete/{{.}}" class="delete-btn" onclick="return confirm('Are you sure?')">Delete</a>
                </li>
                {{else}}
                <li class="file-item" style="justify-content: center; color: #a0aec0;">No files shared yet.</li>
                {{end}}
            </ul>
        </div>
    </div>

    <script>
        function updateCount() {
            const input = document.getElementById('file-upload');
            const countDisplay = document.getElementById('selected-files-count');
            if (input.files.length > 0) {
                countDisplay.textContent = input.files.length + ' file(s) selected';
            } else {
                countDisplay.textContent = 'No files selected';
            }
        }
    </script>
</body>
</html>
