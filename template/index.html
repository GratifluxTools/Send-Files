<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Send Files</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f7f6; --card: #ffffff; --text: #2d3748; --muted: #718096;
    --line: #e2e8f0; --accent: #3182ce; --ok: #38a169; --danger: #e53e3e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1a202c; --card: #2d3748; --text: #edf2f7; --muted: #a0aec0; --line: #4a5568; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg); color: var(--text);
  }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 8px 0 16px; }
  h1 small { font-size: 12px; color: var(--muted); font-weight: normal; }
  section { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 6px rgba(0,0,0,.08); }
  h2 { font-size: 16px; margin: 0 0 12px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .badge { font-size: 12px; padding: 2px 10px; border-radius: 999px; background: var(--line); }
  .badge.on { background: var(--ok); color: #fff; }
  .muted { color: var(--muted); font-size: 13px; }
  button, .btn {
    display: inline-block; border: 0; border-radius: 8px; padding: 10px 16px;
    font-size: 15px; font-weight: 600; cursor: pointer; background: var(--accent); color: #fff;
  }
  button.secondary { background: var(--line); color: var(--text); }
  button.off { background: var(--danger); }
  button:disabled { opacity: .5; cursor: default; }
  .drop { border: 2px dashed var(--line); border-radius: 10px; padding: 24px; text-align: center; }
  .drop.over { border-color: var(--accent); }
  input[type=file] { display: none; }
  progress { width: 100%; height: 10px; margin-top: 12px; }
  textarea {
    width: 100%; min-height: 90px; border-radius: 8px; border: 1px solid var(--line);
    padding: 8px; font: inherit; background: var(--bg); color: var(--text);
  }
  ul { list-style: none; margin: 0; padding: 0; }
  li.file { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  li.file:last-child { border-bottom: 0; }
  li.file a { flex: 1; color: var(--text); text-decoration: none; word-break: break-all; }
  li.file a:hover { text-decoration: underline; }
  .meta { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .del { background: none; color: var(--danger); padding: 4px 8px; font-size: 13px; }
  code, li a.addr { word-break: break-all; }
</style>
</head>
<body>
<main>
  <h1>Send Files <small>v{{.Version}}</small></h1>

  <section>
    <h2>アクセスポイント</h2>
    <div class="row">
      <span id="hs-badge" class="badge">確認中…</span>
      <button id="hs-toggle" disabled>確認中…</button>
    </div>
    <p class="muted" id="hs-info"></p>
    <p class="muted">iPad などのブラウザで次の URL を開いてください</p>
    <ul>
      {{range .Addrs}}<li><a class="addr" href="{{.}}">{{.}}</a></li>{{end}}
    </ul>
  </section>

  <section>
    <h2>ファイルを送る</h2>
    <div class="drop" id="drop">
      <label class="btn" for="file-input">ファイルを選択</label>
      <input id="file-input" type="file" multiple>
      <p class="muted">ドラッグ＆ドロップでも送れます（1回あたり最大 {{.MaxMB}} MB）</p>
    </div>
    <progress id="progress" value="0" max="1" hidden></progress>
    <p class="muted" id="upload-status"></p>
  </section>

  <section>
    <h2>テキストを送る</h2>
    <textarea id="text" placeholder="ここに貼り付けると、テキストファイルとして保存されます"></textarea>
    <div class="row" style="margin-top: 8px;">
      <button id="text-send">テキストを保存</button>
    </div>
  </section>

  <section>
    <h2>共有ファイル <span class="muted" id="count"></span></h2>
    <ul id="files"></ul>
  </section>
</main>

<script>
(function () {
  function $(id) { return document.getElementById(id); }
  function fmtSize(n) {
    if (n < 1024) return n + ' B';
    if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
    if (n < 1073741824) return (n / 1048576).toFixed(1) + ' MB';
    return (n / 1073741824).toFixed(2) + ' GB';
  }
  function fmtDate(sec) { return new Date(sec * 1000).toLocaleString(); }
  function readJSON(res) { return res.json().catch(function () { return {}; }); }
  function errorOf(res, data) { return (data && data.error) || res.statusText || ('HTTP ' + res.status); }

  // ---- 共有ファイル一覧
  var status = $('upload-status');

  function renderFiles(files) {
    var ul = $('files');
    ul.textContent = '';
    $('count').textContent = files.length ? '(' + files.length + ')' : '';
    if (!files.length) {
      var empty = document.createElement('li');
      empty.className = 'muted';
      empty.textContent = 'まだファイルはありません';
      ul.appendChild(empty);
      return;
    }
    files.forEach(function (f) {
      var li = document.createElement('li');
      li.className = 'file';
      var a = document.createElement('a');
      a.href = '/download/' + encodeURIComponent(f.name);
      a.setAttribute('download', '');
      a.textContent = f.name;
      var meta = document.createElement('span');
      meta.className = 'meta';
      meta.textContent = fmtSize(f.size) + '  ' + fmtDate(f.modified);
      var del = document.createElement('button');
      del.className = 'del secondary';
      del.textContent = '削除';
      del.onclick = function () { removeFile(f.name); };
      li.appendChild(a);
      li.appendChild(meta);
      li.appendChild(del);
      ul.appendChild(li);
    });
  }

  function loadFiles() {
    fetch('/api/files', { cache: 'no-store' })
      .then(function (res) { return res.ok ? res.json() : null; })
      .then(function (files) { if (files) renderFiles(files); })
      .catch(function () {});
  }

  function removeFile(name) {
    if (!confirm('「' + name + '」を削除しますか？')) return;
    fetch('/api/delete', { method: 'POST', body: new URLSearchParams({ name: name }) })
      .then(function (res) {
        if (!res.ok) {
          return readJSON(res).then(function (d) { alert('削除に失敗しました: ' + errorOf(res, d)); });
        }
      })
      .then(loadFiles);
  }

  // ---- アップロード（進捗表示つき）
  var drop = $('drop'), input = $('file-input'), prog = $('progress');

  function upload(files) {
    if (!files || !files.length) return;
    var fd = new FormData();
    for (var i = 0; i < files.length; i++) {
      fd.append('files', files[i], files[i].name);
    }
    var xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/upload');
    prog.hidden = false;
    prog.value = 0;
    status.textContent = '送信中…（' + files.length + ' 件）';
    xhr.upload.onprogress = function (e) {
      if (e.lengthComputable) prog.value = e.loaded / e.total;
    };
    xhr.onload = function () {
      prog.hidden = true;
      var data = {};
      try { data = JSON.parse(xhr.responseText); } catch (e) {}
      if (xhr.status >= 200 && xhr.status < 300) {
        status.textContent = (data.saved ? data.saved.length : files.length) + ' 件を保存しました';
      } else {
        status.textContent = 'エラー: ' + (data.error || xhr.statusText);
      }
      input.value = '';
      loadFiles();
    };
    xhr.onerror = function () {
      prog.hidden = true;
      status.textContent = '通信エラーで送信できませんでした';
    };
    xhr.send(fd);
  }

  input.addEventListener('change', function () { upload(input.files); });
  ['dragenter', 'dragover'].forEach(function (t) {
    drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.add('over'); });
  });
  ['dragleave', 'drop'].forEach(function (t) {
    drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.remove('over'); });
  });
  drop.addEventListener('drop', function (e) { upload(e.dataTransfer.files); });

  // ---- テキスト保存
  $('text-send').onclick = function () {
    var text = $('text').value;
    if (!text.trim()) return;
    fetch('/api/text', { method: 'POST', body: new URLSearchParams({ text: text }) })
      .then(function (res) {
        if (res.ok) {
          $('text').value = '';
          status.textContent = 'テキストを保存しました';
          loadFiles();
        } else {
          return readJSON(res).then(function (d) { alert('保存に失敗しました: ' + errorOf(res, d)); });
        }
      })
      .catch(function () { alert('通信エラーで保存できませんでした'); });
  };

  // ---- アクセスポイント（ON/OFF）
  var badge = $('hs-badge'), btn = $('hs-toggle'), info = $('hs-info');

  function renderHS(st) {
    if (!st.supported) {
      badge.textContent = '非対応';
      badge.className = 'badge';
      btn.disabled = true;
      btn.textContent = '切り替え不可';
      btn.dataset.active = '';
      info.textContent = st.message || '';
      return;
    }
    badge.textContent = st.active ? 'ON' : 'OFF';
    badge.className = 'badge' + (st.active ? ' on' : '');
    btn.disabled = false;
    btn.textContent = st.active ? 'アクセスポイントを停止' : 'アクセスポイントを開始';
    btn.className = st.active ? 'off' : '';
    btn.dataset.active = st.active ? '1' : '';
    var parts = [];
    if (st.ssid) parts.push('SSID: ' + st.ssid);
    if (st.password) parts.push('パスワード: ' + st.password);
    if (st.message) parts.push(st.message);
    info.textContent = parts.join('　');
  }

  function loadHS() {
    fetch('/api/hotspot', { cache: 'no-store' })
      .then(readJSON)
      .then(renderHS)
      .catch(function () { badge.textContent = '取得失敗'; });
  }

  btn.onclick = function () {
    var active = btn.dataset.active === '1';
    if (active && !confirm('停止すると、接続中の端末から切断されます。よろしいですか？')) return;
    btn.disabled = true;
    info.textContent = active ? '停止しています…' : '開始しています…（数秒かかることがあります）';
    fetch(active ? '/api/hotspot/stop' : '/api/hotspot/start', { method: 'POST' })
      .then(function (res) {
        return readJSON(res).then(function (d) {
          if (!res.ok) alert('アクセスポイントの操作に失敗しました: ' + errorOf(res, d));
        });
      })
      .catch(function () { alert('通信エラーが発生しました'); })
      .then(loadHS);
  };

  loadFiles();
  loadHS();
  setInterval(loadFiles, 5000);
  setInterval(loadHS, 30000);
})();
</script>
</body>
</html>
